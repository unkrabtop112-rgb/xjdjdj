name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Create project files and build
        run: |
          mkdir -p 'app'
          cat > 'app/build.gradle' <<'PINSKIN_EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.pinskin.lsp'
              compileSdk 34

              defaultConfig {
                  applicationId 'com.pinskin.lsp'
                  minSdk 26
                  targetSdk 33
                  versionCode 2
                  versionName '2.0'
              }
              signingConfigs {
                  debug {
                      storeFile rootProject.file('bloodknife.p12')
                      storePassword 'bloodknife'
                      keyAlias 'bloodknife'
                      keyPassword 'bloodknife'
                      storeType 'pkcs12'
                  }
              }
              buildTypes {
                  release { minifyEnabled false }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              compileOnly 'de.robv.android.xposed:api:82'
          }
          PINSKIN_EOF
          mkdir -p 'app/src/main'
          cat > 'app/src/main/AndroidManifest.xml' <<'PINSKIN_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="@string/app_name"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:theme="@style/AppTheme"
                  android:allowBackup="false">

                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <provider
                      android:name=".ConfigProvider"
                      android:authorities="com.pinskin.lsp.config"
                      android:exported="true"
                      android:directBootAware="true" />

                  <meta-data android:name="xposedmodule" android:value="true" />
                  <meta-data android:name="xposeddescription" android:value="@string/xposed_desc" />
                  <meta-data android:name="xposedminversion" android:value="82" />
                  <meta-data android:name="xposedscope" android:resource="@array/xposed_scope" />
              </application>
          </manifest>
          PINSKIN_EOF
          mkdir -p 'app/src/main/assets'
          cat > 'app/src/main/assets/xposed_init' <<'PINSKIN_EOF'
          com.pinskin.lsp.Hook
          PINSKIN_EOF
          mkdir -p 'app/src/main/java/com/pinskin/lsp'
          cat > 'app/src/main/java/com/pinskin/lsp/AuroraView.java' <<'PINSKIN_EOF'
          package com.pinskin.lsp;

          import android.animation.ValueAnimator;
          import android.content.Context;
          import android.graphics.Canvas;
          import android.graphics.Matrix;
          import android.graphics.Paint;
          import android.graphics.RadialGradient;
          import android.graphics.Shader;
          import android.view.View;
          import android.view.animation.LinearInterpolator;

          /** Медленно плывущие цветные пятна на тёмном фоне: то, что «просвечивает» сквозь стекло. */
          public final class AuroraView extends View {
              // cx, cy, radius (доля от большей стороны), цвет, скорость (целое: цикл замкнут), фаза
              private static final float[][] BLOBS = {
                      {0.15f, 0.10f, 0.75f, 0, 1, 0.0f},
                      {0.90f, 0.45f, 0.80f, 1, 1, 2.1f},
                      {0.20f, 0.88f, 0.85f, 2, 2, 4.0f},
              };
              private static final int[] COLORS = {0xFFE0103A, 0xFF8A0F35, 0xFF3A1FA8};

              private final Paint p = new Paint(Paint.ANTI_ALIAS_FLAG);
              private final Shader[] shaders = new Shader[BLOBS.length];
              private final Matrix m = new Matrix();
              private final ValueAnimator anim = ValueAnimator.ofFloat(0f, (float) (2 * Math.PI));
              private float t;

              public AuroraView(Context c) {
                  super(c);
                  for (int i = 0; i < BLOBS.length; i++) {
                      int col = COLORS[(int) BLOBS[i][3]];
                      shaders[i] = new RadialGradient(0, 0, 1000f,
                              new int[]{(col & 0x00FFFFFF) | 0x8C000000, (col & 0x00FFFFFF) | 0x33000000, col & 0x00FFFFFF},
                              new float[]{0f, 0.5f, 1f}, Shader.TileMode.CLAMP);
                  }
                  anim.setDuration(26000);
                  anim.setRepeatCount(ValueAnimator.INFINITE);
                  anim.setInterpolator(new LinearInterpolator());
                  anim.addUpdateListener(a -> { t = (float) a.getAnimatedValue(); invalidate(); });
              }

              @Override protected void onAttachedToWindow() { super.onAttachedToWindow(); anim.start(); }
              @Override protected void onDetachedFromWindow() { anim.cancel(); super.onDetachedFromWindow(); }

              @Override
              protected void onDraw(Canvas c) {
                  c.drawColor(0xFF07070B);
                  float w = getWidth(), h = getHeight(), big = Math.max(w, h);
                  for (int i = 0; i < BLOBS.length; i++) {
                      float[] b = BLOBS[i];
                      float x = w * (b[0] + 0.14f * (float) Math.sin(t * b[4] + b[5]));
                      float y = h * (b[1] + 0.09f * (float) Math.cos(t * b[4] + b[5]));
                      float rad = big * b[2] * 0.62f;
                      m.setScale(rad / 1000f, rad / 1000f);
                      m.postTranslate(x, y);
                      shaders[i].setLocalMatrix(m);
                      p.setShader(shaders[i]);
                      c.drawCircle(x, y, rad, p);
                  }
              }
          }
          PINSKIN_EOF
          mkdir -p 'app/src/main/java/com/pinskin/lsp'
          cat > 'app/src/main/java/com/pinskin/lsp/Cfg.java' <<'PINSKIN_EOF'
          package com.pinskin.lsp;

          import android.content.Context;
          import android.content.SharedPreferences;
          import android.os.Bundle;

          /** Настройки модуля. Без зависимостей от Xposed: используется и приложением, и хуком. */
          public final class Cfg {
              public static final String MODULE_PKG = "com.pinskin.lsp";
              public static final String PREFS = "pinskin_prefs";

              public static final String K_ENABLED = "enabled";
              public static final String K_SHAPE = "shape";          // 0 круг, 1 скруглённый, 2 квадрат
              public static final String K_BG = "bgColor";           // ARGB
              public static final String K_TEXT = "textColor";       // ARGB
              public static final String K_TEXT_SCALE = "textScale"; // 50..200 %
              public static final String K_OPACITY = "opacity";      // 10..100 %
              public static final String K_SX = "stretchX";          // 50..200 %
              public static final String K_SY = "stretchY";          // 50..200 %
              public static final String K_SMALL = "small";
              public static final String K_NOCLIP = "noClip";
              public static final String K_HIDE = "hideLetters";
              public static final String K_USE_IMG = "useImage";
              public static final String K_IMG = "imageB64";

              public boolean enabled, small, noClip, hideLetters, useImage;
              public int shape, bgColor, textColor, textScale, opacity, stretchX, stretchY;
              public String imageB64;

              interface Source {
                  boolean b(String k, boolean d);
                  int i(String k, int d);
                  String s(String k, String d);
              }

              public static Cfg from(final SharedPreferences sp) {
                  return from(new Source() {
                      public boolean b(String k, boolean d) { return sp.getBoolean(k, d); }
                      public int i(String k, int d) { return sp.getInt(k, d); }
                      public String s(String k, String d) { return sp.getString(k, d); }
                  });
              }

              public static Cfg from(final Bundle bd) {
                  return from(new Source() {
                      public boolean b(String k, boolean d) { return bd.getBoolean(k, d); }
                      public int i(String k, int d) { return bd.getInt(k, d); }
                      public String s(String k, String d) { String v = bd.getString(k); return v == null ? d : v; }
                  });
              }

              private static Cfg from(Source sp) {
                  Cfg c = new Cfg();
                  c.enabled = sp.b(K_ENABLED, true);
                  c.shape = sp.i(K_SHAPE, 0);
                  c.bgColor = sp.i(K_BG, 0xFF3A3A3C);
                  c.textColor = sp.i(K_TEXT, 0xFFFFFFFF);
                  c.textScale = sp.i(K_TEXT_SCALE, 100);
                  c.opacity = sp.i(K_OPACITY, 100);
                  c.stretchX = sp.i(K_SX, 100);
                  c.stretchY = sp.i(K_SY, 100);
                  c.small = sp.b(K_SMALL, false);
                  c.noClip = sp.b(K_NOCLIP, false);
                  c.hideLetters = sp.b(K_HIDE, false);
                  c.useImage = sp.b(K_USE_IMG, false);
                  c.imageB64 = sp.s(K_IMG, "");
                  return c;
              }

              /** Настройки в device-protected хранилище: доступны и до первой разблокировки после загрузки. */
              public static SharedPreferences open(Context ctx) {
                  return ctx.createDeviceProtectedStorageContext().getSharedPreferences(PREFS, Context.MODE_PRIVATE);
              }

              public static SharedPreferences diag(Context ctx) {
                  return ctx.createDeviceProtectedStorageContext().getSharedPreferences("pinskin_diag", Context.MODE_PRIVATE);
              }
          }
          PINSKIN_EOF
          mkdir -p 'app/src/main/java/com/pinskin/lsp'
          cat > 'app/src/main/java/com/pinskin/lsp/ConfigProvider.java' <<'PINSKIN_EOF'
          package com.pinskin.lsp;

          import android.content.ContentProvider;
          import android.content.ContentValues;
          import android.content.Context;
          import android.content.SharedPreferences;
          import android.database.Cursor;
          import android.net.Uri;
          import android.os.Bundle;

          import java.util.Map;

          /** SystemUI обращается сюда через ContentResolver.call(): отдаём настройки и пишем диагностику. */
          public class ConfigProvider extends ContentProvider {
              @Override public boolean onCreate() { return true; }

              @Override
              public Bundle call(String method, String arg, Bundle extras) {
                  Context ctx = getContext();
                  if (ctx == null || method == null) return null;
                  Bundle out = new Bundle();
                  SharedPreferences diag = Cfg.diag(ctx);
                  if (method.equals("cfg")) {
                      for (Map.Entry<String, ?> e : Cfg.open(ctx).getAll().entrySet()) {
                          Object v = e.getValue();
                          if (v instanceof Boolean) out.putBoolean(e.getKey(), (Boolean) v);
                          else if (v instanceof Integer) out.putInt(e.getKey(), (Integer) v);
                          else if (v instanceof String) out.putString(e.getKey(), (String) v);
                      }
                      diag.edit().putLong("lastHit", System.currentTimeMillis())
                              .putInt("hits", diag.getInt("hits", 0) + 1).apply();
                  } else if (method.equals("load")) {
                      diag.edit().putString("status", arg == null ? "" : arg)
                              .putLong("loadTime", System.currentTimeMillis()).apply();
                  }
                  return out;
              }

              @Override public Cursor query(Uri u, String[] p, String s, String[] a, String o) { return null; }
              @Override public String getType(Uri u) { return null; }
              @Override public Uri insert(Uri u, ContentValues v) { return null; }
              @Override public int delete(Uri u, String s, String[] a) { return 0; }
              @Override public int update(Uri u, ContentValues v, String s, String[] a) { return 0; }
          }
          PINSKIN_EOF
          mkdir -p 'app/src/main/java/com/pinskin/lsp'
          cat > 'app/src/main/java/com/pinskin/lsp/GlassDrawable.java' <<'PINSKIN_EOF'
          package com.pinskin.lsp;

          import android.graphics.Canvas;
          import android.graphics.ColorFilter;
          import android.graphics.LinearGradient;
          import android.graphics.Paint;
          import android.graphics.PixelFormat;
          import android.graphics.Rect;
          import android.graphics.RectF;
          import android.graphics.Shader;
          import android.graphics.drawable.Drawable;

          /** Фон «жидкого стекла»: полупрозрачная заливка, верхний блик и градиентная кромка. */
          public final class GlassDrawable extends Drawable {
              private final Paint tintP = new Paint(Paint.ANTI_ALIAS_FLAG);
              private final Paint fillP = new Paint(Paint.ANTI_ALIAS_FLAG);
              private final Paint glossP = new Paint(Paint.ANTI_ALIAS_FLAG);
              private final Paint edgeP = new Paint(Paint.ANTI_ALIAS_FLAG);
              private final RectF r = new RectF();
              private final float radius;
              private final float stroke;

              /** tint: ARGB-подкраска под стеклом (0 = нет). */
              public GlassDrawable(float radiusPx, float strokePx, int tint) {
                  radius = radiusPx;
                  stroke = strokePx;
                  tintP.setColor(tint);
                  edgeP.setStyle(Paint.Style.STROKE);
                  edgeP.setStrokeWidth(strokePx);
              }

              @Override
              protected void onBoundsChange(Rect b) {
                  r.set(b);
                  r.inset(stroke / 2f, stroke / 2f);
                  fillP.setShader(new LinearGradient(b.left, b.top, b.right, b.bottom,
                          new int[]{0x2EFFFFFF, 0x0DFFFFFF, 0x1AFFFFFF}, new float[]{0f, 0.55f, 1f},
                          Shader.TileMode.CLAMP));
                  glossP.setShader(new LinearGradient(0, b.top, 0, b.top + b.height() * 0.55f,
                          0x33FFFFFF, 0x00FFFFFF, Shader.TileMode.CLAMP));
                  edgeP.setShader(new LinearGradient(b.left, b.top, b.right, b.bottom,
                          new int[]{0xB8FFFFFF, 0x1FFFFFFF, 0x00FFFFFF, 0x66FFFFFF}, new float[]{0f, 0.38f, 0.62f, 1f},
                          Shader.TileMode.CLAMP));
              }

              @Override
              public void draw(Canvas c) {
                  if (r.isEmpty()) return;
                  if ((tintP.getColor() >>> 24) != 0) c.drawRoundRect(r, radius, radius, tintP);
                  c.drawRoundRect(r, radius, radius, fillP);
                  c.drawRoundRect(r, radius, radius, glossP);
                  c.drawRoundRect(r, radius, radius, edgeP);
              }

              @Override public void setAlpha(int a) {
                  fillP.setAlpha(a); glossP.setAlpha(a); edgeP.setAlpha(a); invalidateSelf();
              }
              @Override public void setColorFilter(ColorFilter f) {}
              @Override public int getOpacity() { return PixelFormat.TRANSLUCENT; }
          }
          PINSKIN_EOF
          mkdir -p 'app/src/main/java/com/pinskin/lsp'
          cat > 'app/src/main/java/com/pinskin/lsp/Hook.java' <<'PINSKIN_EOF'
          package com.pinskin.lsp;

          import android.app.Application;
          import android.content.Context;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.SystemClock;
          import android.view.View;

          import java.util.Enumeration;

          import dalvik.system.DexFile;
          import de.robv.android.xposed.IXposedHookLoadPackage;
          import de.robv.android.xposed.XC_MethodHook;
          import de.robv.android.xposed.XposedBridge;
          import de.robv.android.xposed.XposedHelpers;
          import de.robv.android.xposed.callbacks.XC_LoadPackage;

          public class Hook implements IXposedHookLoadPackage {
              private static final String TAG = "PinSkin: ";
              private static final Uri URI = Uri.parse("content://com.pinskin.lsp.config/cfg");
              // Имя класса кнопки цифры из AOSP. НЕ проверено на HiOS 13.5.0 (Tecno KJ6).
              private static final String[] KEY_CLASSES = { "com.android.keyguard.NumPadKey" };

              private static volatile Cfg cached;
              private static volatile long cachedAt;

              private static Cfg fetch(Context ctx) {
                  long now = SystemClock.uptimeMillis();
                  Cfg c = cached;
                  if (c != null && now - cachedAt < 1000) return c;
                  try {
                      Bundle b = ctx.getContentResolver().call(URI, "cfg", null, null);
                      if (b != null) { c = Cfg.from(b); cached = c; cachedAt = now; }
                  } catch (Throwable t) {
                      XposedBridge.log(TAG + "provider call failed: " + t);
                  }
                  return c;
              }

              @Override
              public void handleLoadPackage(XC_LoadPackage.LoadPackageParam lpp) {
                  if (!"com.android.systemui".equals(lpp.packageName)) return;

                  final StringBuilder st = new StringBuilder();
                  int hooked = 0;
                  for (String name : KEY_CLASSES) {
                      Class<?> cls = XposedHelpers.findClassIfExists(name, lpp.classLoader);
                      if (cls == null) {
                          XposedBridge.log(TAG + "class not found: " + name);
                          st.append("класс НЕ найден: ").append(name).append("; ");
                          continue;
                      }
                      XposedBridge.hookAllConstructors(cls, new XC_MethodHook() {
                          @Override
                          protected void afterHookedMethod(MethodHookParam param) {
                              if (!(param.thisObject instanceof View)) return;
                              final View v = (View) param.thisObject;
                              v.post(new Runnable() {
                                  @Override public void run() {
                                      try {
                                          Cfg c = fetch(v.getContext());
                                          if (c != null) KeyStyler.apply(v, c);
                                      } catch (Throwable t) {
                                          XposedBridge.log(t);
                                      }
                                  }
                              });
                          }
                      });
                      hooked++;
                      st.append("класс найден и перехвачен: ").append(name).append("; ");
                      XposedBridge.log(TAG + "hooked constructors of " + name);
                  }
                  if (hooked == 0) st.append("похожие классы: ").append(candidates(lpp));

                  final String status = st + " | " + Build.MANUFACTURER + " " + Build.MODEL
                          + " | " + Build.DISPLAY + " | Android " + Build.VERSION.RELEASE;
                  XposedHelpers.findAndHookMethod(Application.class, "onCreate", new XC_MethodHook() {
                      @Override
                      protected void afterHookedMethod(MethodHookParam param) {
                          try {
                              ((Context) param.thisObject).getContentResolver().call(URI, "load", status, null);
                          } catch (Throwable t) {
                              XposedBridge.log(TAG + "report failed: " + t);
                          }
                      }
                  });
              }

              @SuppressWarnings("deprecation")
              private String candidates(XC_LoadPackage.LoadPackageParam lpp) {
                  StringBuilder sb = new StringBuilder();
                  try {
                      DexFile df = new DexFile(lpp.appInfo.sourceDir);
                      Enumeration<String> e = df.entries();
                      int n = 0;
                      while (e.hasMoreElements() && n < 40) {
                          String s = e.nextElement();
                          String l = s.toLowerCase();
                          if (l.contains("numpad") || l.contains("pinkey") || l.contains("keyguardpin")) {
                              sb.append(s).append(", ");
                              n++;
                          }
                      }
                      df.close();
                  } catch (Throwable t) {
                      XposedBridge.log(t);
                      sb.append("(не удалось просканировать)");
                  }
                  return sb.length() == 0 ? "ничего не найдено" : sb.toString();
              }
          }
          PINSKIN_EOF
          mkdir -p 'app/src/main/java/com/pinskin/lsp'
          cat > 'app/src/main/java/com/pinskin/lsp/KeyStyler.java' <<'PINSKIN_EOF'
          package com.pinskin.lsp;

          import android.graphics.Bitmap;
          import android.graphics.BitmapFactory;
          import android.graphics.Outline;
          import android.graphics.drawable.BitmapDrawable;
          import android.graphics.drawable.GradientDrawable;
          import android.util.Base64;
          import android.util.TypedValue;
          import android.view.View;
          import android.view.ViewGroup;
          import android.view.ViewOutlineProvider;
          import android.widget.TextView;

          import java.util.ArrayList;
          import java.util.List;
          import java.util.WeakHashMap;

          /** Оформляет одну кнопку клавиатуры. Один и тот же код для превью и для SystemUI. */
          public final class KeyStyler {
              private static final WeakHashMap<TextView, Float> ORIG_SIZE = new WeakHashMap<>();
              private static String cachedB64 = "";
              private static Bitmap cachedBmp;

              private KeyStyler() {}

              private static synchronized Bitmap bitmap(String b64) {
                  if (b64 == null || b64.isEmpty()) return null;
                  if (b64.equals(cachedB64)) return cachedBmp;
                  try {
                      byte[] raw = Base64.decode(b64, Base64.NO_WRAP);
                      cachedBmp = BitmapFactory.decodeByteArray(raw, 0, raw.length);
                  } catch (Throwable t) {
                      cachedBmp = null;
                  }
                  cachedB64 = b64;
                  return cachedBmp;
              }

              private static void collect(View v, List<TextView> out) {
                  if (v instanceof TextView) {
                      out.add((TextView) v);
                  } else if (v instanceof ViewGroup) {
                      ViewGroup g = (ViewGroup) v;
                      for (int i = 0; i < g.getChildCount(); i++) collect(g.getChildAt(i), out);
                  }
              }

              public static void apply(View key, Cfg c) {
                  if (!c.enabled) return;
                  float density = key.getResources().getDisplayMetrics().density;

                  List<TextView> tvs = new ArrayList<>();
                  collect(key, tvs);
                  TextView digit = null, letters = null;
                  for (TextView tv : tvs) {
                      CharSequence t = tv.getText();
                      if (digit == null && t != null && t.length() == 1 && Character.isDigit(t.charAt(0))) digit = tv;
                      else if (letters == null) letters = tv;
                  }
                  if (digit == null && !tvs.isEmpty()) {
                      digit = tvs.get(0);
                      letters = tvs.size() > 1 ? tvs.get(1) : null;
                  }

                  // Фон кнопки
                  final int shape = c.shape;
                  Bitmap bmp = c.useImage ? bitmap(c.imageB64) : null;
                  if (bmp != null) {
                      key.setBackground(new BitmapDrawable(key.getResources(), bmp));
                      key.setOutlineProvider(new ViewOutlineProvider() {
                          @Override public void getOutline(View v, Outline o) {
                              int w = v.getWidth(), h = v.getHeight();
                              if (shape == 2) o.setRect(0, 0, w, h);
                              else o.setRoundRect(0, 0, w, h, Math.min(w, h) / (shape == 0 ? 2f : 4f));
                          }
                      });
                      key.setClipToOutline(true);
                  } else {
                      GradientDrawable g = new GradientDrawable();
                      g.setColor(c.bgColor);
                      if (shape == 0) g.setShape(GradientDrawable.OVAL);
                      else {
                          g.setShape(GradientDrawable.RECTANGLE);
                          g.setCornerRadius(shape == 1 ? 18 * density : 0f);
                      }
                      key.setBackground(g);
                      key.setClipToOutline(false);
                  }

                  // Текст
                  if (digit != null) {
                      digit.setTextColor(c.textColor);
                      Float orig = ORIG_SIZE.get(digit);
                      if (orig == null) { orig = digit.getTextSize(); ORIG_SIZE.put(digit, orig); }
                      digit.setTextSize(TypedValue.COMPLEX_UNIT_PX, orig * c.textScale / 100f);
                  }
                  if (letters != null) {
                      if (c.hideLetters) letters.setVisibility(View.GONE);
                      else letters.setTextColor(c.textColor);
                  }

                  // Размер, прозрачность, обрезка
                  float small = c.small ? 0.8f : 1f;
                  key.setScaleX(c.stretchX / 100f * small);
                  key.setScaleY(c.stretchY / 100f * small);
                  key.setAlpha(c.opacity / 100f);
                  if (c.noClip) {
                      View cur = key;
                      for (int i = 0; i < 4 && cur.getParent() instanceof ViewGroup; i++) {
                          ViewGroup p = (ViewGroup) cur.getParent();
                          p.setClipChildren(false);
                          p.setClipToPadding(false);
                          cur = p;
                      }
                  }
              }
          }
          PINSKIN_EOF
          mkdir -p 'app/src/main/java/com/pinskin/lsp'
          cat > 'app/src/main/java/com/pinskin/lsp/MainActivity.java' <<'PINSKIN_EOF'
          package com.pinskin.lsp;

          import android.app.Activity;
          import android.app.AlertDialog;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.res.ColorStateList;
          import android.graphics.Bitmap;
          import android.graphics.BitmapFactory;
          import android.graphics.Color;
          import android.graphics.Outline;
          import android.graphics.Typeface;
          import android.graphics.drawable.ColorDrawable;
          import android.graphics.drawable.GradientDrawable;
          import android.media.ThumbnailUtils;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.util.Base64;
          import android.view.Gravity;
