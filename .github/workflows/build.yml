              private int dp(int v) { return Math.round(v * getResources().getDisplayMetrics().density); }
              private float dpf(float v) { return v * getResources().getDisplayMetrics().density; }

              // ====================================================================== lifecycle
              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  sp = Cfg.open(this);
                  Cfg c = Cfg.from(sp);
                  selected = b != null ? b.getInt("tab", 0) : 0;
                  setupWindow();

                  FrameLayout frame = new FrameLayout(this);
                  frame.addView(new AuroraView(this), new FrameLayout.LayoutParams(-1, -1));
                  for (int i = 0; i < 2; i++) {
                      ScrollView sv = new ScrollView(this);
                      sv.setVerticalScrollBarEnabled(false);
                      sv.setOverScrollMode(View.OVER_SCROLL_NEVER);
                      LinearLayout col = new LinearLayout(this);
                      col.setOrientation(LinearLayout.VERTICAL);
                      sv.addView(col, new FrameLayout.LayoutParams(-1, -2));
                      cols[i] = col;
                      pages[i] = sv;
                      frame.addView(sv, new FrameLayout.LayoutParams(-1, -1));
                  }
                  buildMisc(c);
                  buildCredits();
                  buildTabBar(frame);
                  setContentView(frame);

                  pages[1 - selected].setVisibility(View.GONE);
                  indicator.setTranslationX(selected * dp(116));
                  updateTabColors();
                  applyInsets();
                  frame.setOnApplyWindowInsetsListener((v, in) -> {
                      topInset = in.getSystemWindowInsetTop();
                      bottomInset = in.getSystemWindowInsetBottom();
                      applyInsets();
                      return in;
                  });
                  frame.requestApplyInsets();
                  playEntrance(cols[selected]);
                  refresh();
              }

              @Override
              protected void onSaveInstanceState(Bundle out) {
                  super.onSaveInstanceState(out);
                  out.putInt("tab", selected);
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  updateDiag();
              }

              private void setupWindow() {
                  Window w = getWindow();
                  w.setBackgroundDrawable(new ColorDrawable(0xFF07070B));
                  w.setStatusBarColor(Color.TRANSPARENT);
                  w.setNavigationBarColor(Color.TRANSPARENT);
                  if (Build.VERSION.SDK_INT >= 30) {
                      w.setDecorFitsSystemWindows(false);
                  } else {
                      w.getDecorView().setSystemUiVisibility(View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                              | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION);
                  }
                  if (Build.VERSION.SDK_INT >= 29) w.setNavigationBarContrastEnforced(false);
              }

              private void applyInsets() {
                  for (LinearLayout col : cols) col.setPadding(dp(16), topInset + dp(18), dp(16), bottomInset + dp(120));
                  FrameLayout.LayoutParams lp = (FrameLayout.LayoutParams) tabBar.getLayoutParams();
                  lp.bottomMargin = bottomInset + dp(18);
                  tabBar.setLayoutParams(lp);
              }

