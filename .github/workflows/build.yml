              private void buildTabBar(FrameLayout frame) {
                  tabBar = new FrameLayout(this);
                  tabBar.setBackground(new GlassDrawable(dpf(34), dpf(1.2f), 0x8C090910));

                  indicator = new View(this);
                  indicator.setBackground(new GlassDrawable(dpf(28), dpf(1.2f), 0x73E5173F));
                  FrameLayout.LayoutParams ilp = new FrameLayout.LayoutParams(dp(116), dp(54),
                          Gravity.CENTER_VERTICAL | Gravity.START);
                  ilp.leftMargin = dp(6);
                  tabBar.addView(indicator, ilp);

                  LinearLayout row = new LinearLayout(this);
                  row.setPadding(dp(6), 0, dp(6), 0);
                  String[] names = {"Misc", "Credits"};
                  for (int i = 0; i < 2; i++) {
                      final int idx = i;
                      TextView t = tv(names[i], 15, TEXT2, true);
                      t.setGravity(Gravity.CENTER);
                      t.setOnClickListener(v -> select(idx));
                      pressable(t);
                      tabLabels[i] = t;
                      row.addView(t, new LinearLayout.LayoutParams(dp(116), -1));
                  }
                  tabBar.addView(row, new FrameLayout.LayoutParams(-1, -1));
                  frame.addView(tabBar, new FrameLayout.LayoutParams(dp(244), dp(66),
                          Gravity.BOTTOM | Gravity.CENTER_HORIZONTAL));
              }

              private void select(int idx) {
                  if (idx == selected) return;
                  final int old = selected;
                  selected = idx;
                  indicator.animate().translationX(idx * dp(116)).setDuration(420)
                          .setInterpolator(new OvershootInterpolator(1.15f)).start();
                  updateTabColors();

                  final View out = pages[old];
                  out.animate().cancel();
                  out.animate().alpha(0f).setDuration(140).withEndAction(() -> {
                      if (selected != old) out.setVisibility(View.GONE);
                      out.setAlpha(1f);
                  }).start();

                  View in = pages[idx];
                  in.animate().cancel();
                  in.setAlpha(1f);
                  in.setVisibility(View.VISIBLE);
                  ((ScrollView) in).scrollTo(0, 0);
                  playEntrance(cols[idx]);
              }

              private void updateTabColors() {
                  for (int i = 0; i < 2; i++) tabLabels[i].setTextColor(i == selected ? 0xFFFFFFFF : TEXT2);
              }

              private void playEntrance(LinearLayout col) {
                  for (int i = 0; i < col.getChildCount(); i++) {
                      View ch = col.getChildAt(i);
                      ch.setAlpha(0f);
                      ch.setTranslationY(dp(22));
                      ch.animate().alpha(1f).translationY(0f).setStartDelay(Math.min(i, 8) * 45L)
                              .setDuration(380).setInterpolator(new DecelerateInterpolator(1.6f)).start();
                  }
              }

              // ====================================================================== UI helpers
              private TextView tv(String s, int sp_, int color, boolean bold) {
                  TextView t = new TextView(this);
                  t.setText(s);
                  t.setTextSize(sp_);
                  t.setTextColor(color);
                  t.setTypeface(Typeface.create(bold ? "sans-serif-medium" : "sans-serif", Typeface.NORMAL));
                  if (bold) t.getPaint().setFakeBoldText(false);
                  return t;
              }

              private ImageView iconView(final int size) {
                  ImageView v = new ImageView(this);
                  v.setImageDrawable(getPackageManager().getApplicationIcon(getApplicationInfo()));
                  v.setOutlineProvider(new ViewOutlineProvider() {
                      @Override public void getOutline(View x, Outline o) {
                          o.setRoundRect(0, 0, x.getWidth(), x.getHeight(), size * 0.28f);
                      }
                  });
                  v.setClipToOutline(true);
                  return v;
              }

              private void card(String title) {
                  LinearLayout c = new LinearLayout(this);
                  c.setOrientation(LinearLayout.VERTICAL);
                  c.setPadding(dp(18), dp(16), dp(18), dp(16));
                  c.setBackground(new GlassDrawable(dpf(26), dpf(1.2f), 0));
                  LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(-1, -2);
                  lp.bottomMargin = dp(14);
                  page.addView(c, lp);
                  if (title != null) {
                      TextView t = tv(title, 15, ACCENT, true);
                      t.setPadding(0, 0, 0, dp(6));
                      c.addView(t);
                  }
                  cur = c;
              }

              private void pressable(View v) {
                  v.setOnTouchListener((view, e) -> {
                      int a = e.getActionMasked();
                      if (a == MotionEvent.ACTION_DOWN) {
                          view.animate().scaleX(0.95f).scaleY(0.95f).setDuration(110).start();
                      } else if (a == MotionEvent.ACTION_UP || a == MotionEvent.ACTION_CANCEL) {
                          view.animate().scaleX(1f).scaleY(1f).setDuration(280)
                                  .setInterpolator(new OvershootInterpolator(2.4f)).start();
                      }
                      return false;
                  });
              }

              private TextView gbtn(String text, int tint, View.OnClickListener l) {
                  TextView t = tv(text, 14, TEXT1, true);
                  t.setGravity(Gravity.CENTER);
                  t.setPadding(dp(16), dp(14), dp(16), dp(14));
                  t.setBackground(new GlassDrawable(dpf(20), dpf(1.2f), tint));
                  t.setOnClickListener(l);
                  pressable(t);
                  LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(-1, -2);
                  lp.topMargin = dp(10);
                  cur.addView(t, lp);
                  return t;
              }

              private void sw(String label, final String key, boolean val) {
                  LinearLayout row = new LinearLayout(this);
                  row.setGravity(Gravity.CENTER_VERTICAL);
                  row.setPadding(0, dp(8), 0, dp(8));
                  TextView l = tv(label, 15, TEXT1, false);
                  row.addView(l, new LinearLayout.LayoutParams(0, -2, 1f));
                  Switch s = new Switch(this);
                  int[][] st = {{android.R.attr.state_checked}, {}};
                  s.setThumbTintList(new ColorStateList(st, new int[]{0xFFFFFFFF, 0xFFE0E0E0}));
                  s.setTrackTintList(new ColorStateList(st, new int[]{0xFFE5173F, 0x55FFFFFF}));
                  s.setChecked(val);
                  s.setOnCheckedChangeListener((cb, on) -> {
                      sp.edit().putBoolean(key, on).apply();
                      refresh();
                  });
                  LinearLayout.LayoutParams slp = new LinearLayout.LayoutParams(-2, -2);
                  slp.leftMargin = dp(12);
                  row.addView(s, slp);
                  cur.addView(row);
              }

              private void seek(final String label, final String key, final int min, final int max, int val) {
                  LinearLayout top = new LinearLayout(this);
                  top.setPadding(0, dp(12), 0, 0);
                  top.addView(tv(label, 14, TEXT1, false), new LinearLayout.LayoutParams(0, -2, 1f));
                  final TextView v = tv(val + "%", 14, ACCENT, true);
                  top.addView(v);
                  cur.addView(top);

                  SeekBar s = new SeekBar(this);
                  s.setMax(max - min);
                  s.setProgress(val - min);
                  s.setProgressTintList(ColorStateList.valueOf(ACCENT));
                  s.setThumbTintList(ColorStateList.valueOf(0xFFFFFFFF));
                  s.setProgressBackgroundTintList(ColorStateList.valueOf(0x40FFFFFF));
                  s.setOnSeekBarChangeListener(new SeekBar.OnSeekBarChangeListener() {
                      @Override public void onProgressChanged(SeekBar sb, int pr, boolean user) {
                          int x = pr + min;
                          v.setText(x + "%");
                          if (user) { sp.edit().putInt(key, x).apply(); refresh(); }
                      }
                      @Override public void onStartTrackingTouch(SeekBar sb) {}
                      @Override public void onStopTrackingTouch(SeekBar sb) {}
                  });
                  cur.addView(s);
              }

              private static String hex(int c) { return String.format("#%08X", c); }

              private GradientDrawable swatch(int color) {
                  GradientDrawable g = new GradientDrawable();
                  g.setShape(GradientDrawable.OVAL);
                  g.setColor(color);
                  g.setStroke(dp(2), 0x80FFFFFF);
                  return g;
              }

              private void colorRow(final String label, final String key, final int def) {
                  LinearLayout row = new LinearLayout(this);
                  row.setGravity(Gravity.CENTER_VERTICAL);
                  row.setPadding(dp(14), dp(12), dp(14), dp(12));
                  row.setBackground(new GlassDrawable(dpf(18), dpf(1f), 0));
                  LinearLayout.LayoutParams rlp = new LinearLayout.LayoutParams(-1, -2);
                  rlp.topMargin = dp(10);

                  LinearLayout txt = new LinearLayout(this);
                  txt.setOrientation(LinearLayout.VERTICAL);
                  txt.addView(tv(label, 15, TEXT1, false));
                  final TextView hx = tv(hex(sp.getInt(key, def)), 12, TEXT2, false);
                  txt.addView(hx);
                  row.addView(txt, new LinearLayout.LayoutParams(0, -2, 1f));

                  final View sw = new View(this);
                  sw.setBackground(swatch(sp.getInt(key, def)));
                  row.addView(sw, new LinearLayout.LayoutParams(dp(30), dp(30)));

                  row.setOnClickListener(v -> {
                      final EditText et = new EditText(this);
                      et.setText(hex(sp.getInt(key, def)));
                      new AlertDialog.Builder(this, android.R.style.Theme_Material_Dialog_Alert)
                              .setTitle(label + " (#RRGGBB или #AARRGGBB)")
                              .setView(et)
                              .setPositiveButton("OK", (d, w) -> {
                                  try {
                                      int col = Color.parseColor(et.getText().toString().trim());
                                      sp.edit().putInt(key, col).apply();
                                      hx.setText(hex(col));
                                      sw.setBackground(swatch(col));
                                      refresh();
                                  } catch (IllegalArgumentException e) {
                                      Toast.makeText(this, "Неверный цвет", Toast.LENGTH_SHORT).show();
                                  }
                              })
                              .setNegativeButton("Отмена", null)
                              .show();
                  });
                  pressable(row);
                  cur.addView(row, rlp);
              }

              private void shapeChips(int selectedShape) {
                  String[] names = {"Круг", "Скруглённый", "Квадрат"};
                  shapeChips = new TextView[3];
                  LinearLayout row = new LinearLayout(this);
                  for (int i = 0; i < 3; i++) {
                      final int idx = i;
                      TextView t = tv(names[i], 13, TEXT1, true);
                      t.setGravity(Gravity.CENTER);
                      t.setPadding(dp(4), dp(12), dp(4), dp(12));
                      t.setOnClickListener(v -> {
                          sp.edit().putInt(Cfg.K_SHAPE, idx).apply();
                          styleChips(idx);
                          refresh();
                      });
                      pressable(t);
                      shapeChips[i] = t;
                      LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(0, -2, 1f);
                      lp.setMargins(dp(3), 0, dp(3), 0);
                      row.addView(t, lp);
                  }
                  styleChips(selectedShape);
                  cur.addView(row);
              }

              private void styleChips(int sel) {
                  for (int i = 0; i < shapeChips.length; i++) {
                      shapeChips[i].setBackground(new GlassDrawable(dpf(16), dpf(1f), i == sel ? 0x80E5173F : 0));
                      shapeChips[i].setTextColor(i == sel ? 0xFFFFFFFF : TEXT2);
                  }
              }

              private void presetRow() {
                  // shape, bg, text, opacity, stretchX, stretchY, small
                  final Object[][] presets = {
                          {"Классика", 0, 0xFF3A3A3C, 0xFFFFFFFF, 100, 100, 100, false},
                          {"Неон", 0, 0xFF1A0B3A, 0xFF00FFC8, 100, 100, 100, false},
                          {"Стекло", 0, 0x55FFFFFF, 0xFFFFFFFF, 90, 100, 100, false},
                          {"Квадраты", 2, 0xFF222222, 0xFFFFD60A, 100, 100, 100, true},
                  };
                  LinearLayout row = new LinearLayout(this);
                  row.setPadding(0, dp(4), 0, 0);
                  for (final Object[] p : presets) {
                      TextView bt = tv((String) p[0], 12, TEXT1, true);
                      bt.setGravity(Gravity.CENTER);
                      bt.setSingleLine(true);
                      bt.setPadding(dp(2), dp(13), dp(2), dp(13));
                      bt.setBackground(new GlassDrawable(dpf(16), dpf(1f), 0));
                      bt.setOnClickListener(v -> {
                          sp.edit().putInt(Cfg.K_SHAPE, (Integer) p[1]).putInt(Cfg.K_BG, (Integer) p[2])
                                  .putInt(Cfg.K_TEXT, (Integer) p[3]).putInt(Cfg.K_OPACITY, (Integer) p[4])
                                  .putInt(Cfg.K_SX, (Integer) p[5]).putInt(Cfg.K_SY, (Integer) p[6])
                                  .putBoolean(Cfg.K_SMALL, (Boolean) p[7]).apply();
                          recreate();
                      });
                      pressable(bt);
                      LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(0, -2, 1f);
                      lp.setMargins(dp(3), 0, dp(3), 0);
                      row.addView(bt, lp);
                  }
                  cur.addView(row);
              }

              // ====================================================================== diagnostics
              private void updateDiag() {
                  SharedPreferences d = Cfg.diag(this);
                  java.text.DateFormat f = java.text.DateFormat.getTimeInstance();
                  long lt = d.getLong("loadTime", 0), lh = d.getLong("lastHit", 0);
                  StringBuilder s = new StringBuilder();
                  if (lt == 0) {
                      s.append("• SystemUI ещё не загружал модуль (проверь область действия в LSPosed и перезапусти SystemUI)\n");
                  } else {
                      s.append("• SystemUI загрузил модуль в ").append(f.format(new java.util.Date(lt))).append("\n");
                      s.append("• ").append(d.getString("status", "")).append("\n");
                  }
                  if (lh == 0) {
                      s.append("• Кнопки клавиатуры ещё ни разу не запрашивали стиль (открой ввод PIN на экране блокировки)");
                  } else {
                      s.append("• Стиль запрашивали ").append(d.getInt("hits", 0)).append(" раз, последний раз в ")
                              .append(f.format(new java.util.Date(lh)));
                  }
                  diagView.setText(s);
              }

              // ====================================================================== Preview
              private void buildPreview() {
                  LinearLayout box = new LinearLayout(this);
                  box.setBackground(new GlassDrawable(dpf(22), dpf(1f), 0x66000000));
                  box.setGravity(Gravity.CENTER);
                  box.setPadding(dp(8), dp(22), dp(8), dp(22));
                  box.setClipChildren(false);
                  box.setClipToPadding(false);

                  GridLayout grid = new GridLayout(this);
                  grid.setColumnCount(3);
                  grid.setClipChildren(false);
                  grid.setClipToPadding(false);
                  int[] order = {1, 2, 3, 4, 5, 6, 7, 8, 9, -1, 0, -1};
                  for (int d : order) {
                      GridLayout.LayoutParams lp = new GridLayout.LayoutParams();
                      lp.width = dp(72);
                      lp.height = dp(72);
                      lp.setMargins(dp(5), dp(5), dp(5), dp(5));
                      if (d < 0) { grid.addView(new View(this), lp); continue; }

                      FrameLayout key = new FrameLayout(this);
                      LinearLayout inner = new LinearLayout(this);
                      inner.setOrientation(LinearLayout.VERTICAL);
                      inner.setGravity(Gravity.CENTER);
                      TextView digit = new TextView(this);
                      digit.setText(String.valueOf(d));
                      digit.setTextSize(26);
                      digit.setGravity(Gravity.CENTER);
                      TextView letters = new TextView(this);
                      letters.setText(d >= 1 ? LETTERS[d - 1 < LETTERS.length ? d - 1 : 0] : "");
                      letters.setTextSize(9);
                      letters.setGravity(Gravity.CENTER);
                      inner.addView(digit);
                      inner.addView(letters);
                      key.addView(inner, new FrameLayout.LayoutParams(-1, -1, Gravity.CENTER));
                      keys.add(key);
                      grid.addView(key, lp);
                  }
                  box.addView(grid);
                  LinearLayout.LayoutParams blp = new LinearLayout.LayoutParams(-1, -2);
                  blp.topMargin = dp(6);
                  cur.addView(box, blp);
              }

              private void refresh() {
                  Cfg c = Cfg.from(sp);
                  c.enabled = true; // в превью всегда показываем стиль
                  for (View k : keys) KeyStyler.apply(k, c);
              }

              // ====================================================================== Image
              @Override
              protected void onActivityResult(int req, int res, Intent data) {
                  super.onActivityResult(req, res, data);
                  if (req != REQ_IMG || res != RESULT_OK || data == null || data.getData() == null) return;
                  try {
                      String b64 = encode(data.getData());
                      sp.edit().putString(Cfg.K_IMG, b64).putBoolean(Cfg.K_USE_IMG, true).apply();
                      recreate();
                  } catch (Exception e) {
                      Toast.makeText(this, "Не удалось прочитать картинку", Toast.LENGTH_LONG).show();
                  }
              }

              private String encode(Uri u) throws Exception {
                  BitmapFactory.Options o = new BitmapFactory.Options();
                  o.inJustDecodeBounds = true;
                  try (InputStream in = getContentResolver().openInputStream(u)) {
                      BitmapFactory.decodeStream(in, null, o);
                  }
                  int big = Math.max(o.outWidth, o.outHeight), s = 1;
                  while (big / s > 512) s *= 2;
                  o = new BitmapFactory.Options();
                  o.inSampleSize = s;
                  Bitmap bmp;
                  try (InputStream in = getContentResolver().openInputStream(u)) {
                      bmp = BitmapFactory.decodeStream(in, null, o);
                  }
                  if (bmp == null) throw new Exception("decode failed");
                  Bitmap sq = ThumbnailUtils.extractThumbnail(bmp, 192, 192);
                  ByteArrayOutputStream bo = new ByteArrayOutputStream();
                  sq.compress(bmp.hasAlpha() ? Bitmap.CompressFormat.PNG : Bitmap.CompressFormat.JPEG, 90, bo);
                  return Base64.encodeToString(bo.toByteArray(), Base64.NO_WRAP);
              }

              // ====================================================================== Restart SystemUI
              private void restartSystemUi() {
                  new Thread(() -> {
                      String msg;
                      try {
                          Process p = new ProcessBuilder("su", "-c", "kill $(pidof com.android.systemui)").start();
                          int code = p.waitFor();
                          msg = code == 0 ? "SystemUI перезапускается" : "su вернул код " + code + ". Перезагрузи телефон.";
                      } catch (Exception e) {
                          msg = "Нет root-доступа. Перезагрузи телефон.";
                      }
                      final String m = msg;
                      runOnUiThread(() -> Toast.makeText(this, m, Toast.LENGTH_LONG).show());
                  }).start();
              }
          }
